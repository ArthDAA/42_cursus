[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding on a small LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["llm_sdk/", "\\.venv/"]
